<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz CMMG</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background-image: url('fundo.png');
  background-size: cover;
  background-position: center;
}

.container {
  max-width:500px;
  margin:auto;
  padding:30px 20px;
}

.card {
  background: rgba(255,255,255,0.95);
  padding:30px;
  border-radius:20px;
}

input {
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:14px;
  background:#0077c8;
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
}

.checkbox {
  text-align:center;
  margin:15px 0;
}

.hidden { display:none; }

.option {
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:8px 0;
  cursor:pointer;
}

.option:hover {
  background:#e6f7f7;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Descubra sua área na saúde</h2>

<div id="lead">
<input type="text" id="nome" placeholder="Seu nome">
<input type="email" id="email" placeholder="Seu e-mail">
<input type="text" id="telefone" placeholder="(31) 99999-9999">

<div class="checkbox">
<label>
<input type="checkbox" id="aceite">
<br>
Aceito receber informações da Faculdade Ciências Médicas
</label>
</div>

<button onclick="startQuiz()">Começar</button>
</div>

<div id="quiz" class="hidden">
<p id="question"></p>
<div id="options"></div>
</div>

<div id="result" class="hidden"></div>

</div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycby_zhQFoBuzZlCI8fYrhP4m3G_7PtJ65NAzWYxrYLsEYSOoqZQuyEsMPjtFr56ewNM/exec";

const questions = [
  {
    q:"Ambiente ideal?",
    o:["Cuidar pessoas","Reabilitação","Comunicação","Diagnóstico","Procedimentos","Emoções"]
  },
  {
    q:"Atividade preferida?",
    o:["Cuidar","Exercícios","Fala","Estudar corpo","Clínico","Acolher"]
  }
];

let answers = [];
let current = 0;

function startQuiz(){
  const nome = document.getElementById('nome').value;
  const email = document.getElementById('email').value;
  const telefone = document.getElementById('telefone').value;
  const aceite = document.getElementById('aceite').checked;

  if(!nome || !email || !telefone){
    alert("Preencha todos os campos");
    return;
  }

  if(!aceite){
    alert("Aceite os termos");
    return;
  }

  document.getElementById('lead').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');

  loadQuestion();
}

function loadQuestion(){
  const q = questions[current];
  document.getElementById('question').innerText = q.q;

  const optDiv = document.getElementById('options');
  optDiv.innerHTML = "";

  q.o.forEach((opt, i)=>{
    const div = document.createElement('div');
    div.className="option";
    div.innerText = opt;
    div.onclick = ()=>selectOption(i);
    optDiv.appendChild(div);
  });
}

function selectOption(i){
  answers.push(i);
  current++;

  if(current < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');

  const nome = document.getElementById('nome').value;
  const email = document.getElementById('email').value;
  const telefone = document.getElementById('telefone').value;

  fetch(URL, {
    method:"POST",
    mode:"no-cors",
    body: JSON.stringify({
      nome,
      email,
      telefone,
      resultado: "Quiz concluído",
      respostas: answers.join(", "),
      aceite: "Sim"
    })
  });

  document.getElementById('result').innerHTML =
    "<h3>Obrigado! Seus dados foram enviados.</h3>";
}

// máscara telefone
document.getElementById('telefone').addEventListener('input', function(e){
  let v = e.target.value.replace(/\D/g,'');

  if(v.length > 11) v = v.slice(0,11);

  if(v.length > 6)
    v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if(v.length > 2)
    v = `(${v.slice(0,2)}) ${v.slice(2)}`;

  e.target.value = v;
});
</script>

</body>
</html>
