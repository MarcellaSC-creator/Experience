<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz CMMG Experience</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background-image: url('fundo.png');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 80, 75, 0.35);
  z-index: -1;
}

.container {
  max-width: 620px;
  margin: 0 auto;
  padding: 40px 20px;
}

.card {
  background: rgba(255,255,255,0.95);
  padding: 32px;
  border-radius: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

h1, h2 {
  color: #003b70;
}

h1 {
  font-size: 30px;
  margin-bottom: 12px;
}

p {
  color: #333;
  line-height: 1.5;
}

input[type="text"],
input[type="email"],
input[type="tel"] {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #0077c8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

  .logo {
  margin-top: 20px;
  text-align: center;
}

.logo img {
  max-width: 220px;
  width: 100%;
  height: auto;
  opacity: 0.9;
}

button:hover {
  background: #005fa3;
}

.checkbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 18px 0 24px;
  text-align: center;
}

.checkbox input {
  transform: scale(1.25);
  margin-bottom: 8px;
}

.checkbox span {
  display: block;
  width: 100%;
  max-width: 390px;
  font-size: 15px;
  line-height: 1.45;
  text-align: center;
  color: #333;
}

.note {
  font-size: 13px;
  color: #666;
  margin-top: 4px;
}

.hidden {
  display: none;
}

.progress {
  height: 8px;
  background: #d9e6ef;
  border-radius: 20px;
  margin-bottom: 20px;
}

.progress-bar {
  height: 8px;
  background: #00a99d;
  border-radius: 20px;
  width: 0%;
}

.question-number {
  font-weight: bold;
  color: #0077c8;
  margin-bottom: 6px;
}

.option {
  background: #f8fbff;
  border: 1px solid #d5e2ec;
  border-radius: 12px;
  padding: 13px;
  margin: 10px 0;
  cursor: pointer;
  transition: 0.2s;
}

.option:hover {
  background: #e5f7f5;
  border-color: #00a99d;
}

.result-box {
  background: #f0fbfa;
  border-left: 5px solid #00a99d;
  padding: 18px;
  border-radius: 12px;
  margin: 18px 0;
}

.result-box p {
  margin: 8px 0;
}

.status {
  font-size: 13px;
  color: #555;
  margin-top: 14px;
}

@media (max-width: 768px) {
  body {
    background-image: url('fundo.png');
    background-size: cover;
    background-position: center top;
    background-attachment: scroll;
  }

  .container {
    max-width: 100%;
    padding: 24px 16px;
  }

  .card {
    padding: 24px 20px;
    border-radius: 18px;
  }

  h1 {
    font-size: 24px;
    text-align: center;
  }

  h2 {
    font-size: 20px;
    text-align: center;
  }

  p {
    font-size: 14px;
    text-align: center;
  }

  .option {
    font-size: 14px;
    padding: 12px;
  }

  button {
    font-size: 15px;
    padding: 13px;
  }

  .checkbox span {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Qual área da saúde realmente combina com você?</h1>

    <div id="lead">
      <p>
        Preencha seus dados e responda ao quiz para descobrir sua afinidade com uma das graduações da Faculdade Ciências Médicas de Minas Gerais.
      </p>

      <p class="note">
        <em>* Este quiz não é um teste de aptidão.</em>
      </p>

      <input type="text" id="nome" placeholder="Seu nome">
      <input type="email" id="email" placeholder="Seu e-mail">
      <input type="tel" id="telefone" placeholder="(31) 99999-9999">

      <label class="checkbox">
        <input type="checkbox" id="aceite">
        <span>
          Eu aceito receber informações sobre a<br>
          <strong>Faculdade Ciências Médicas de Minas Gerais</strong>
        </span>
      </label>

      <button type="button" onclick="startQuiz()">Começar o quiz</button>
    </div>
    <div class="logo">
  <img src="logo-cmmg.png" alt="Faculdade Ciências Médicas de Minas Gerais">
</div>

    <div id="quiz" class="hidden">
      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="question-number" id="questionNumber"></div>
      <h2 id="question"></h2>
      <div id="options"></div>
    </div>

    <div id="result" class="hidden"></div>

  </div>
</div>

<script>
const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycby_zhQFoBuzZlCI8fYrhP4m3G_7PtJ65NAzWYxrYLsEYSOoqZQuyEsMPjtFr56ewNM/exec";

const questions = [
  {
    q: "Em um ambiente de trabalho ideal, você prefere:",
    o: [
      { letra: "A", texto: "Estar próximo do paciente, oferecendo cuidado contínuo" },
      { letra: "B", texto: "Trabalhar com recuperação física e evolução funcional" },
      { letra: "C", texto: "Estimular comunicação, fala e expressão" },
      { letra: "D", texto: "Investigar doenças e tomar decisões clínicas" },
      { letra: "E", texto: "Executar procedimentos técnicos com precisão" },
      { letra: "F", texto: "Escutar e compreender emoções profundamente" }
    ]
  },
  {
    q: "O que mais te interessa estudar?",
    o: [
      { letra: "A", texto: "Rotinas de cuidado e suporte ao paciente" },
      { letra: "B", texto: "Anatomia e movimento do corpo" },
      { letra: "C", texto: "Linguagem, fala e audição" },
      { letra: "D", texto: "Funcionamento completo do corpo humano e doenças" },
      { letra: "E", texto: "Estruturas dentárias e procedimentos clínicos" },
      { letra: "F", texto: "Comportamento humano e mente" }
    ]
  },
  {
    q: "Como você reage diante de um problema complexo?",
    o: [
      { letra: "A", texto: "Busco acolher e resolver de forma prática" },
      { letra: "B", texto: "Penso em soluções funcionais e progressivas" },
      { letra: "C", texto: "Tento melhorar a comunicação envolvida" },
      { letra: "D", texto: "Analiso profundamente antes de decidir" },
      { letra: "E", texto: "Foco na execução correta e técnica" },
      { letra: "F", texto: "Avalio o impacto emocional e psicológico" }
    ]
  },
  {
    q: "Qual habilidade mais te representa?",
    o: [
      { letra: "A", texto: "Cuidado e responsabilidade" },
      { letra: "B", texto: "Coordenação motora e observação corporal" },
      { letra: "C", texto: "Comunicação e escuta ativa" },
      { letra: "D", texto: "Raciocínio lógico e análise" },
      { letra: "E", texto: "Precisão e atenção aos detalhes" },
      { letra: "F", texto: "Empatia e sensibilidade" }
    ]
  },
  {
    q: "Qual cenário te atrai mais?",
    o: [
      { letra: "A", texto: "Hospital com contato constante com pacientes" },
      { letra: "B", texto: "Clínica de reabilitação ou esportiva" },
      { letra: "C", texto: "Consultório de linguagem" },
      { letra: "D", texto: "Centro hospitalar ou diagnóstico" },
      { letra: "E", texto: "Consultório odontológico" },
      { letra: "F", texto: "Clínica terapêutica" }
    ]
  },
  {
    q: "O que mais te motiva?",
    o: [
      { letra: "A", texto: "Cuidar de pessoas no dia a dia" },
      { letra: "B", texto: "Recuperar movimentos e autonomia" },
      { letra: "C", texto: "Melhorar a comunicação" },
      { letra: "D", texto: "Resolver casos complexos" },
      { letra: "E", texto: "Transformar sorrisos" },
      { letra: "F", texto: "Promover saúde mental" }
    ]
  },
  {
    q: "Como você prefere ajudar alguém?",
    o: [
      { letra: "A", texto: "Estando presente e cuidando" },
      { letra: "B", texto: "Trabalhando na recuperação física" },
      { letra: "C", texto: "Facilitando a comunicação" },
      { letra: "D", texto: "Diagnosticando e tratando" },
      { letra: "E", texto: "Realizando intervenções técnicas" },
      { letra: "F", texto: "Acolhendo emocionalmente" }
    ]
  },
  {
    q: "Você se identifica mais com:",
    o: [
      { letra: "A", texto: "Rotina dinâmica e assistencial" },
      { letra: "B", texto: "Evolução gradual e acompanhamento físico" },
      { letra: "C", texto: "Desenvolvimento da comunicação" },
      { letra: "D", texto: "Tomada de decisão sob pressão" },
      { letra: "E", texto: "Procedimentos detalhados" },
      { letra: "F", texto: "Conversas profundas e reflexivas" }
    ]
  },
  {
    q: "Qual dessas características mais combina com você?",
    o: [
      { letra: "A", texto: "Dedicação e cuidado" },
      { letra: "B", texto: "Persistência e prática" },
      { letra: "C", texto: "Expressividade" },
      { letra: "D", texto: "Liderança e responsabilidade" },
      { letra: "E", texto: "Perfeccionismo" },
      { letra: "F", texto: "Sensibilidade" }
    ]
  },
  {
    q: "Você prefere trabalhar:",
    o: [
      { letra: "A", texto: "Em equipe, com contato constante" },
      { letra: "B", texto: "Com foco em evolução do paciente" },
      { letra: "C", texto: "Com foco em comunicação" },
      { letra: "D", texto: "Liderando decisões clínicas" },
      { letra: "E", texto: "Com procedimentos técnicos" },
      { letra: "F", texto: "Em escuta individual" }
    ]
  },
  {
    q: "Qual tipo de impacto você quer gerar?",
    o: [
      { letra: "A", texto: "Cuidado contínuo e suporte" },
      { letra: "B", texto: "Recuperação física e autonomia" },
      { letra: "C", texto: "Inclusão por meio da comunicação" },
      { letra: "D", texto: "Cura e tratamento de doenças" },
      { letra: "E", texto: "Estética e saúde bucal" },
      { letra: "F", texto: "Equilíbrio emocional" }
    ]
  },
  {
    q: "Em situações de pressão, você:",
    o: [
      { letra: "A", texto: "Mantém o cuidado e apoio" },
      { letra: "B", texto: "Foca na solução prática" },
      { letra: "C", texto: "Busca clareza na comunicação" },
      { letra: "D", texto: "Toma decisões rápidas" },
      { letra: "E", texto: "Se concentra na execução" },
      { letra: "F", texto: "Mantém o equilíbrio emocional" }
    ]
  }
];

const results = {
  A: {
    curso: "Enfermagem",
    desc: "Você tem um perfil cuidador, responsável e essencial. Sua força está na presença constante, no cuidado humano e na atenção aos detalhes do paciente.",
    diferencial: "Empatia + organização + resistência emocional",
    ondeAtua: "Hospitais, clínicas, UTI, saúde pública",
    evolucao: "Especializações em emergência, UTI ou gestão hospitalar"
  },
  B: {
    curso: "Fisioterapia",
    desc: "Seu perfil é prático, focado em evolução e movimento. Você gosta de ver resultados progressivos e transformar a qualidade de vida das pessoas.",
    diferencial: "Disciplina + visão funcional",
    ondeAtua: "Clínicas, esportes, reabilitação, hospitais",
    evolucao: "Fisioterapia esportiva, neurofuncional ou estética"
  },
  C: {
    curso: "Fonoaudiologia",
    desc: "Você se conecta com a comunicação humana. Tem habilidade para ajudar pessoas a se expressarem melhor e se integrarem socialmente.",
    diferencial: "Escuta + linguagem",
    ondeAtua: "Clínicas, escolas, hospitais",
    evolucao: "Voz profissional, linguagem infantil ou audiologia"
  },
  D: {
    curso: "Medicina",
    desc: "Perfil analítico, estratégico e decisivo. Você se destaca na investigação, diagnóstico e resolução de problemas complexos.",
    diferencial: "Raciocínio + liderança",
    ondeAtua: "Hospitais, clínicas, diversas especialidades",
    evolucao: "Especializações médicas diversas"
  },
  E: {
    curso: "Odontologia",
    desc: "Você tem perfil técnico, detalhista e preciso. Gosta de trabalhar com as mãos e ver resultados concretos.",
    diferencial: "Precisão + estética",
    ondeAtua: "Consultório próprio ou clínicas",
    evolucao: "Ortodontia, implantodontia, estética"
  },
  F: {
    curso: "Psicologia",
    desc: "Seu perfil é emocionalmente inteligente e reflexivo. Você tem facilidade para compreender pessoas e ajudar no desenvolvimento pessoal.",
    diferencial: "Escuta + análise emocional",
    ondeAtua: "Clínicas, empresas, escolas",
    evolucao: "Clínica, organizacional, neuropsicologia"
  }
};

let current = 0;
let answers = [];

document.getElementById("telefone").addEventListener("input", function(e) {
  let v = e.target.value.replace(/\D/g, "");

  if (v.length > 11) v = v.slice(0, 11);

  if (v.length > 10) {
    v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  } else if (v.length > 6) {
    v = `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`;
  } else if (v.length > 2) {
    v = `(${v.slice(0,2)}) ${v.slice(2)}`;
  } else if (v.length > 0) {
    v = `(${v}`;
  }

  e.target.value = v;
});

function startQuiz() {
  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const telefone = document.getElementById("telefone").value.trim();

  if (!nome || !email || !telefone) {
    alert("Preencha nome, e-mail e celular para começar.");
    return;
  }

  document.getElementById("lead").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  loadQuestion();
}

function loadQuestion() {
  const question = questions[current];

  document.getElementById("questionNumber").innerText =
    `Pergunta ${current + 1} de ${questions.length}`;

  document.getElementById("question").innerText = question.q;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  question.o.forEach(option => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerHTML = `<strong>${option.letra})</strong> ${option.texto}`;
    div.onclick = () => selectOption(option.letra, option.texto);
    optionsDiv.appendChild(div);
  });

  document.getElementById("progressBar").style.width =
    `${((current + 1) / questions.length) * 100}%`;
}

function selectOption(letra, texto) {
  answers.push({
    pergunta: questions[current].q,
    letra: letra,
    resposta: texto
  });

  current++;

  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const count = { A:0, B:0, C:0, D:0, E:0, F:0 };

  answers.forEach(item => {
    count[item.letra]++;
  });

  const winner = Object.keys(count).reduce((a, b) =>
    count[a] >= count[b] ? a : b
  );

  const finalResult = results[winner];

  document.getElementById("result").innerHTML = `
    <h2>Seu resultado: ${finalResult.curso}</h2>

    <div class="result-box">
      <p>${finalResult.desc}</p>
      <p><strong>💡 Seu diferencial:</strong> ${finalResult.diferencial}</p>
      <p><strong>📍 Onde pode atuar:</strong> ${finalResult.ondeAtua}</p>
      <p><strong>🚀 Possível evolução:</strong> ${finalResult.evolucao}</p>
    </div>

    <p>Seus dados foram registrados. Em breve, você poderá receber informações sobre a Faculdade Ciências Médicas de Minas Gerais.</p>

    <p class="status" id="statusEnvio">Enviando suas informações...</p>
  `;

  sendToGoogleSheets(finalResult);
}

function sendToGoogleSheets(finalResult) {
  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const aceite = document.getElementById("aceite").checked ? "Sim" : "Não";

  const respostasTexto = answers.map((item, index) =>
    `${index + 1}. ${item.pergunta}
${item.letra}) ${item.resposta}`
  ).join("\n\n");

  fetch(GOOGLE_SHEETS_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      nome: nome,
      email: email,
      telefone: telefone,
      resultado: finalResult.curso,
      diferencial: finalResult.diferencial,
      ondeAtua: finalResult.ondeAtua,
      evolucao: finalResult.evolucao,
      respostas: respostasTexto,
      aceite: aceite
    })
  })
  .then(() => {
    document.getElementById("statusEnvio").innerText =
      "Informações enviadas com sucesso.";
  })
  .catch(() => {
    document.getElementById("statusEnvio").innerText =
      "Resultado gerado. Caso o envio não apareça na planilha, revise a configuração do Apps Script.";
  });
}
</script>

</body>
</html>
