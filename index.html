<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz CMMG Experience</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background-image: url('fundo.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 80, 75, 0.35);
  z-index: -1;
}

.container {
  max-width: 560px;
  margin: 0 auto;
  padding: 40px 20px;
}

.card {
  background: rgba(255, 255, 255, 0.94);
  padding: 32px;
  border-radius: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

h1 {
  color: #003b70;
  font-size: 32px;
  margin-bottom: 12px;
}

h2 {
  color: #003b70;
}

p {
  color: #333;
  line-height: 1.5;
}

input[type="text"],
input[type="email"] {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #0077c8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

button:hover {
  background: #005fa3;
}

.checkbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 18px 0 24px;
  text-align: center;
}

.checkbox input {
  transform: scale(1.25);
  margin-bottom: 8px;
}

.checkbox span {
  display: block;
  width: 100%;
  max-width: 360px;
  font-size: 15px;
  line-height: 1.45;
  text-align: center;
  color: #333;
}

.hidden {
  display: none;
}

.progress {
  height: 8px;
  background: #d9e6ef;
  border-radius: 20px;
  margin-bottom: 20px;
}

.progress-bar {
  height: 8px;
  background: #00a99d;
  border-radius: 20px;
  width: 0%;
}

.question-number {
  font-weight: bold;
  color: #0077c8;
  margin-bottom: 6px;
}

.option {
  background: #f8fbff;
  border: 1px solid #d5e2ec;
  border-radius: 12px;
  padding: 13px;
  margin: 10px 0;
  cursor: pointer;
  transition: 0.2s;
}

.option:hover {
  background: #e5f7f5;
  border-color: #00a99d;
}

.result-box {
  background: #f0fbfa;
  border-left: 5px solid #00a99d;
  padding: 18px;
  border-radius: 12px;
  margin: 18px 0;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Descubra sua área na saúde</h1>

    <div id="lead">
      <p>Responda ao quiz e descubra qual graduação da área da saúde mais combina com você.</p>

      <input type="text" id="nome" placeholder="Seu nome">
      <input type="email" id="email" placeholder="Seu e-mail">

      <label class="checkbox">
        <input type="checkbox" id="aceite">
        <span>
          Aceito receber informações sobre a<br>
          <strong>Faculdade Ciências Médicas de Minas Gerais</strong>
        </span>
      </label>

      <button type="button" onclick="startQuiz()">Começar o quiz</button>
    </div>

    <div id="quiz" class="hidden">
      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="question-number" id="questionNumber"></div>
      <h2 id="question"></h2>
      <div id="options"></div>
    </div>

    <div id="result" class="hidden"></div>

  </div>
</div>

<script>
const questions = [
  {
    q: "Em um ambiente de trabalho ideal, você prefere:",
    o: [
      { letra: "A", texto: "Cuidar diretamente de pessoas em diferentes estados de saúde" },
      { letra: "B", texto: "Ajudar na reabilitação física e recuperação de movimentos" },
      { letra: "C", texto: "Trabalhar com comunicação, voz e expressão" },
      { letra: "D", texto: "Diagnosticar problemas complexos e tomar decisões críticas" },
      { letra: "E", texto: "Realizar procedimentos técnicos e trabalhar com precisão manual" },
      { letra: "F", texto: "Ouvir, acolher e compreender emoções e comportamentos" }
    ]
  },
  {
    q: "Qual dessas atividades mais te atrai?",
    o: [
      { letra: "A", texto: "Monitorar pacientes e prestar cuidados contínuos" },
      { letra: "B", texto: "Aplicar exercícios e terapias físicas" },
      { letra: "C", texto: "Trabalhar fala, audição e linguagem" },
      { letra: "D", texto: "Estudar o corpo humano profundamente e investigar doenças" },
      { letra: "E", texto: "Realizar procedimentos clínicos detalhados" },
      { letra: "F", texto: "Conversar e ajudar pessoas a lidarem com seus sentimentos" }
    ]
  },
  {
    q: "Como você costuma lidar com problemas?",
    o: [
      { letra: "A", texto: "Com empatia e foco no cuidado imediato" },
      { letra: "B", texto: "Pensando em soluções práticas e reabilitação" },
      { letra: "C", texto: "Buscando melhorar a comunicação e compreensão" },
      { letra: "D", texto: "Investigando causas e tomando decisões assertivas" },
      { letra: "E", texto: "Agindo com precisão e técnica" },
      { letra: "F", texto: "Refletindo sobre emoções e comportamentos envolvidos" }
    ]
  },
  {
    q: "Qual habilidade você considera mais forte em você?",
    o: [
      { letra: "A", texto: "Cuidado e atenção ao outro" },
      { letra: "B", texto: "Coordenação motora e percepção corporal" },
      { letra: "C", texto: "Comunicação e escuta ativa" },
      { letra: "D", texto: "Raciocínio lógico e tomada de decisão" },
      { letra: "E", texto: "Habilidade manual e atenção aos detalhes" },
      { letra: "F", texto: "Empatia e análise emocional" }
    ]
  },
  {
    q: "Qual cenário profissional mais te interessa?",
    o: [
      { letra: "A", texto: "Hospital, atuando diretamente com pacientes" },
      { letra: "B", texto: "Clínica de reabilitação ou esportiva" },
      { letra: "C", texto: "Consultório de linguagem e audição" },
      { letra: "D", texto: "Hospital ou clínica com foco em diagnóstico e tratamento" },
      { letra: "E", texto: "Consultório odontológico" },
      { letra: "F", texto: "Consultório ou clínica terapêutica" }
    ]
  },
  {
    q: "O que mais te motiva na área da saúde?",
    o: [
      { letra: "A", texto: "Cuidar e acompanhar a evolução dos pacientes" },
      { letra: "B", texto: "Ajudar pessoas a recuperarem movimentos e qualidade de vida" },
      { letra: "C", texto: "Melhorar a comunicação e inclusão social" },
      { letra: "D", texto: "Salvar vidas e resolver casos complexos" },
      { letra: "E", texto: "Transformar sorrisos e saúde bucal" },
      { letra: "F", texto: "Promover saúde mental e bem-estar emocional" }
    ]
  }
];

const results = {
  A: {
    curso: "Enfermagem",
    desc: "Perfil cuidador, atento e essencial no acompanhamento do paciente."
  },
  B: {
    curso: "Fisioterapia",
    desc: "Foco em reabilitação, movimento e recuperação funcional."
  },
  C: {
    curso: "Fonoaudiologia",
    desc: "Interesse por comunicação, linguagem e desenvolvimento humano."
  },
  D: {
    curso: "Medicina",
    desc: "Perfil investigativo, decisivo e voltado para diagnóstico e tratamento."
  },
  E: {
    curso: "Odontologia",
    desc: "Habilidade técnica, precisão e foco em saúde bucal."
  },
  F: {
    curso: "Psicologia",
    desc: "Afinidade com comportamento humano, escuta e saúde mental."
  }
};

let current = 0;
let answers = [];

function startQuiz() {
  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const aceite = document.getElementById("aceite").checked;

  if (!nome || !email) {
    alert("Preencha seu nome e e-mail para começar.");
    return;
  }

  if (!aceite) {
    alert("Você precisa aceitar receber informações para continuar.");
    return;
  }

  document.getElementById("lead").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  loadQuestion();
}

function loadQuestion() {
  const question = questions[current];

  document.getElementById("questionNumber").innerText =
    `Pergunta ${current + 1} de ${questions.length}`;

  document.getElementById("question").innerText = question.q;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  question.o.forEach(option => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerHTML = `<strong>${option.letra})</strong> ${option.texto}`;
    div.onclick = () => selectOption(option.letra, option.texto);
    optionsDiv.appendChild(div);
  });

  document.getElementById("progressBar").style.width =
    `${((current + 1) / questions.length) * 100}%`;
}

function selectOption(letra, texto) {
  answers.push({
    pergunta: questions[current].q,
    letra: letra,
    resposta: texto
  });

  current++;

  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const count = { A:0, B:0, C:0, D:0, E:0, F:0 };

  answers.forEach(item => {
    count[item.letra]++;
  });

  const winner = Object.keys(count).reduce((a, b) =>
    count[a] >= count[b] ? a : b
  );

  const result = results[winner];

  document.getElementById("result").innerHTML = `
    <h2>Seu resultado: ${result.curso}</h2>

    <div class="result-box">
      <p>${result.desc}</p>
    </div>

    <p>Quer saber mais sobre essa graduação na Faculdade Ciências Médicas de Minas Gerais?</p>

    <button type="button" onclick="sendWhatsApp('${result.curso}')">
      Falar com um especialista
    </button>
  `;
}

function sendWhatsApp(curso) {
  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();

  const respostasTexto = answers.map((item, index) =>
    `${index + 1}. ${item.pergunta}
${item.letra}) ${item.resposta}`
  ).join("\\n\\n");

  const textoMensagem =
`Olá! Novo lead do quiz CMMG Experience:

Nome: ${nome}
E-mail: ${email}
Aceitou receber informações: Sim
Resultado: ${curso}

Respostas:
${respostasTexto}`;

  const msg = encodeURIComponent(textoMensagem);

  const telefone = "5531988913888";

  window.open(`https://wa.me/${telefone}?text=${msg}`, "_blank");
}
</script>

</body>
</html>
